name: Docs Build & Deployment

on:
  push:
    branches: [docs]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
           python -m pip install --upgrade pip
           python -m pip install sphinx
           python -m pip install numpydoc
           python -m pip install sphinx_mdinclude
           python -m pip install sphinx-rtd-theme
           python -m pip install sphinx-gallery
           python -m pip install nbsphinx-link
           python -m pip install nbsphinx
           python -m pip install sphinxcontrib-email
           python -m pip install ipython
           python -m pip install .
    - name: Setup Pandoc
      uses: r-lib/actions/setup-pandoc@v2
    - name: Build with Sphinx
      run: |
           sphinx-build -E -b html ./docs/source ./pages
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
